<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Rota PEV - v2.1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#F6F4EC; --surface:#FFFFFF; --border:#DED8C4; --border-strong:#C7BFA3;
  --ink:#182B20; --ink-soft:#586254; --ink-faint:#8A9182;
  --green:#2F6B4F; --green-dark:#1F4C37; --green-light:#E4EFE6;
  --amber:#B8641E; --amber-light:#F8E9D6;
  --red:#B23A2E; --red-light:#F7E4E1;
  --blue:#2A5C8A;
  --radius:12px;
  --font-display:'Space Grotesk',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);-webkit-tap-highlight-color:transparent;}
body{padding-bottom:120px;}
h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0;}
button{font-family:var(--font-body);cursor:pointer;}
.hidden{display:none !important;}

.topbar{position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--border);padding:14px 16px 10px;}
.topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.brand{display:flex;align-items:baseline;gap:8px;}
.brand h1{font-size:20px;letter-spacing:-0.01em;}
.brand .count{font-family:var(--font-mono);font-size:12px;color:var(--ink-soft);}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px;}
.stat .n{font-family:var(--font-display);font-size:20px;font-weight:700;line-height:1.1;}
.stat .l{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin-top:2px;}
.stat.pending .n{color:var(--amber);}
.stat.done .n{color:var(--green);}

.tabs{display:flex;gap:6px;margin-top:12px;}
.tab-btn{flex:1;padding:9px 0;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);font-size:14px;font-weight:500;color:var(--ink-soft);}
.tab-btn.active{background:var(--green);border-color:var(--green);color:#fff;}

.recalc-row{display:flex;gap:8px;margin-top:10px;}
.btn{border-radius:var(--radius);border:1px solid var(--border-strong);background:var(--surface);padding:10px 14px;font-size:13px;font-weight:500;color:var(--ink);display:flex;align-items:center;gap:6px;justify-content:center;}
.btn:active{transform:scale(.98);}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff;}
.btn.ghost{background:transparent;}
.btn.small{padding:7px 10px;font-size:12px;}
.btn.full{width:100%;}
.btn.danger{color:var(--red);border-color:var(--red-light);}

.banner{margin:10px 16px 0;padding:10px 12px;border-radius:var(--radius);font-size:13px;line-height:1.5;}
.banner.warn{background:var(--amber-light);color:#5c380f;border:1px solid #EAC492;}
.banner.info{background:var(--green-light);color:var(--green-dark);border:1px solid #BFDCC9;}

#geocode-overlay{position:fixed;inset:0;background:rgba(246,244,236,.97);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;}
#geocode-overlay h2{font-size:17px;margin-bottom:8px;}
#geocode-overlay p{font-size:13px;color:var(--ink-soft);max-width:280px;margin:0 auto 18px;}
.progress-track{width:220px;height:6px;background:var(--border);border-radius:3px;overflow:hidden;}
.progress-fill{height:100%;background:var(--green);width:0%;transition:width .2s;}
.progress-label{margin-top:10px;font-family:var(--font-mono);font-size:12px;color:var(--ink-soft);}
.version-tag{margin-top:8px;font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);}

.view{padding:14px 16px;}
.list{display:flex;flex-direction:column;gap:10px;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;display:flex;gap:12px;}
.card.done{opacity:.55;}
.order-badge{font-family:var(--font-display);font-weight:700;font-size:18px;color:var(--green-dark);min-width:30px;padding-top:1px;}
.card.done .order-badge{color:var(--ink-faint);}
.card-body{flex:1;min-width:0;}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.container-id{font-family:var(--font-mono);font-size:12px;color:var(--ink-soft);}
.dist-tag{font-family:var(--font-mono);font-size:11px;color:var(--blue);white-space:nowrap;}
.addr{font-size:14px;line-height:1.4;margin:4px 0 6px;}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.badge{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--green-light);color:var(--green-dark);font-weight:500;}
.badge.freq{background:var(--amber-light);color:#6b3f0f;}
.badge.manual{background:#E0F2FE;color:#0369A1;}
.card-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.check-row{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;}
.check-row input{width:18px;height:18px;accent-color:var(--green);}
.thumb{width:34px;height:34px;border-radius:6px;object-fit:cover;border:1px solid var(--border);}
.nav-link{font-size:12px;font-weight:500;padding:7px 10px;border-radius:var(--radius);border:1px solid var(--border-strong);text-decoration:none;color:var(--ink);}
.nav-link.gmaps{background:var(--blue);border-color:var(--blue);color:#fff;}
.nav-link.waze{background:#33ccff;border-color:#33ccff;color:#0a2a3d;}

#map{width:100%;height:60vh;border-radius:var(--radius);border:1px solid var(--border);}
.leaflet-div-icon{background:transparent;border:none;}
.pin{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;border:2px solid #fff;}
.pin span{transform:rotate(45deg);font-family:var(--font-mono);font-size:10px;font-weight:700;color:#fff;}
.pin.pending{background:var(--amber);}
.pin.done{background:var(--green);}
.pin.me{background:var(--blue);border-radius:50%;}

.bottombar{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);padding:10px 16px;display:flex;flex-direction:column;gap:6px;z-index:40;}
.bottombar-row{display:flex;gap:8px;}

.modal-bg{position:fixed;inset:0;background:rgba(24,43,32,.5);z-index:90;display:flex;align-items:center;justify-content:center;padding:24px;}
.modal{background:var(--surface);border-radius:16px;padding:20px;max-width:340px;width:100%;}
.modal h3{font-size:16px;margin-bottom:8px;}
.modal p{font-size:13px;color:var(--ink-soft);line-height:1.5;margin:0 0 16px;}
.modal-actions{display:flex;gap:8px;flex-direction:column;}
.modal img{width:100%;border-radius:10px;margin-bottom:12px;}
#edit-map-container{width:100%;height:220px;border-radius:10px;margin-bottom:12px;border:1px solid var(--border);}
</style>
</head>
<body>

<div id="geocode-overlay">
  <h2>Localizando os endereços (Google Maps)</h2>
  <p id="geo-status">Buscando coordenadas exatas no Google Maps para montar o mapa e calcular a rota...</p>
  <div class="progress-track"><div class="progress-fill" id="geo-progress"></div></div>
  <div class="progress-label" id="geo-count">0 / 0</div>
  <div class="version-tag">Versão 2.1</div>
  <button class="btn small" style="margin-top:18px;" id="skip-geocode">Pular e usar lista simples</button>
</div>

<div id="route-overlay" class="hidden" style="position:fixed;inset:0;background:rgba(246,244,236,.97);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;">
  <h2 style="font-size:17px;margin-bottom:8px;">Calculando a melhor rota</h2>
  <p style="font-size:13px;color:var(--ink-soft);max-width:280px;margin:0 auto 18px;">Consultando estimativa de trânsito entre os pontos pendentes.</p>
  <div class="progress-track"><div class="progress-fill" id="route-progress"></div></div>
  <div class="progress-label" id="route-count">0 / 0</div>
  <button class="btn small" style="margin-top:18px;" id="skip-route">Usar distância em linha reta</button>
</div>

<div class="topbar">
  <div class="topbar-row">
    <div class="brand"><h1>Rota PEV</h1><span class="count" id="month-label"></span></div>
    <button class="btn small ghost" id="reset-btn">Reiniciar mês</button>
  </div>
  <div class="stats">
    <div class="stat pending"><div class="n" id="stat-pending">0</div><div class="l">pendentes</div></div>
    <div class="stat done"><div class="n" id="stat-done">0</div><div class="l">visitados</div></div>
    <div class="stat"><div class="n" id="stat-time">0</div><div class="l" id="stat-time-label">min de rota</div></div>
  </div>
  <div class="tabs">
    <button class="tab-btn active" data-tab="list">Lista</button>
    <button class="tab-btn" data-tab="map">Mapa</button>
  </div>
  <div class="recalc-row">
    <button class="btn primary full" id="recalc-btn">Recalcular rota a partir daqui</button>
  </div>
  <div id="banner-slot"></div>
</div>

<div class="view" id="view-list">
  <div class="list" id="list-container"></div>
</div>

<div class="view hidden" id="view-map">
  <div id="map"></div>
</div>

<div class="bottombar">
  <div class="bottombar-row">
    <button class="btn full" id="export-xlsx-btn">Exportar planilha</button>
    <button class="btn full" id="export-photos-btn">Baixar fotos</button>
  </div>
  <div class="bottombar-row">
    <button class="btn full small ghost" id="export-backup-btn">Exportar Backup</button>
    <button class="btn full small ghost" id="import-backup-btn">Restaurar Backup</button>
  </div>
</div>

<input type="file" accept="image/*" capture="environment" id="photo-input" class="hidden">
<input type="file" accept=".json" id="backup-input" class="hidden">
<div id="modal-slot"></div>

const STORAGE_VISITED_KEY = 'visited-status-v1';
const STORAGE_GEOCODE_KEY = 'geocode-cache-google-v2';
const STORAGE_MANUAL_KEY = 'manual-coords-v1';

function haversine(lat1, lon1, lat2, lon2){
  const R = 6371;
  const dLat = (lat2-lat1) * Math.PI/180;
  const dLon = (lon2-lon1) * Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function loadVisited(){
  try{ const r = localStorage.getItem(STORAGE_VISITED_KEY); visited = r ? JSON.parse(r) : {}; }catch(e){ visited = {}; }
}
function saveVisited(){
  try{ localStorage.setItem(STORAGE_VISITED_KEY, JSON.stringify(visited)); }catch(e){}
}
function loadGeocodeCache(){

}
function saveGeocodeCache(){
  try{ localStorage.setItem(STORAGE_GEOCODE_KEY, JSON.stringify(geocodeCache)); }catch(e){}
}
function loadManualCoords(){

}
function saveManualCoords(){
  try{ localStorage.setItem(STORAGE_MANUAL_KEY, JSON.stringify(manualCoords)); }catch(e){}
}

function getActiveCoord(id){
  return manualCoords[id] || geocodeCache[id] || null;
}

function geocodeAddressGoogleSDK(addr){
  return new Promise((resolve) => {
    if(typeof google === 'undefined' || !google.maps){ resolve(null); return; }
    if(!googleGeocoder) googleGeocoder = new google.maps.Geocoder();
    googleGeocoder.geocode({ address: addr }, (results, status) => {
      if(status === 'OK' && results && results[0]){
        const loc = results[0].geometry.location;
        resolve([loc.lat(), loc.lng()]);
      } else {
        resolve(null);
      }
    });
  });
}

function showBanner(type, text){
  document.getElementById('banner-slot').innerHTML = '<div class="banner ' + type + '">' + text + '</div>';
}

async function runGeocoding(){
  const overlay = document.getElementById('geocode-overlay');
  const missing = PEVS.filter(p => !getActiveCoord(p.id));
  if(missing.length === 0){ overlay.classList.add('hidden'); return; }
  document.getElementById('geo-count').textContent = '0 / ' + missing.length;
  let done = 0;
  for(const p of missing){
    if(geocodingAborted) break;
    const coords = await geocodeAddressGoogleSDK(p.endereco);
    if(coords) geocodeCache[p.id] = coords;
    done++;
    document.getElementById('geo-progress').style.width = Math.round(done/missing.length*100) + '%';
    document.getElementById('geo-count').textContent = done + ' / ' + missing.length;
    if(done % 5 === 0) saveGeocodeCache();
    await new Promise(r => setTimeout(r, 60));
  }
  saveGeocodeCache();
  overlay.classList.add('hidden');
}

async function osrmRow(fromCoord, candidateCoords){
  const coordStr = [fromCoord, ...candidateCoords].map(c => c[1]+','+c[0]).join(';');
  const url = 'https://router.project-osrm.org/table/v1/driving/' + coordStr + '?sources=0&annotations=duration,distance';
  const res = await fetch(url);
  if(!res.ok) throw new Error('osrm http error');
  const data = await res.json();
  if(data.code !== 'Ok') throw new Error('osrm bad response');
  return {durations: data.durations[0].slice(1), distances: data.distances[0].slice(1)};
}

function gmapsUrl(p){
  const c = getActiveCoord(p.id);
  const dest = c ? (c[0]+','+c[1]) : encodeURIComponent(p.endereco);
  return 'https://www.google.com/maps/dir/?api=1&destination=' + dest + '&travelmode=driving';
}
function wazeUrl(p){
  const c = getActiveCoord(p.id);
  if(c) return 'https://waze.com/ul?ll=' + c[0] + ',' + c[1] + '&navigate=yes';
  return 'https://waze.com/ul?q=' + encodeURIComponent(p.endereco) + '&navigate=yes';
}

function getPosition(){
  return new Promise((resolve) => {
    if(!navigator.geolocation){ resolve(null); return; }
    navigator.geolocation.getCurrentPosition(
      pos => resolve([pos.coords.latitude, pos.coords.longitude]),
      err => resolve(null),
      {enableHighAccuracy:true, timeout:5000}
    );
  });
}

function nearestNeighborHaversine(startCoord, remaining){
  const order = [];
  const pool = [...remaining];
  let from = startCoord;
  while(pool.length){
    let bestIdx = 0, bestDist = Infinity;
    for(let i=0;i<pool.length;i++){
      const c = getActiveCoord(pool[i].id);
      const d = haversine(from[0], from[1], c[0], c[1]);
      if(d < bestDist){ bestDist = d; bestIdx = i; }
    }
    const chosen = pool.splice(bestIdx,1)[0];
    order.push({...chosen, distFromPrev:null, timeFromPrev: bestDist / 30 * 60});
    from = getActiveCoord(chosen.id);
  }
  return order;
}

async function computeRoute(useRealTime){
  routeCalcAborted = false;
  const pending = PEVS.filter(p => !visited[p.id] && getActiveCoord(p.id));
  const noCoords = PEVS.filter(p => !visited[p.id] && !getActiveCoord(p.id)).map(p => ({...p, distFromPrev:null, timeFromPrev:null}));

  if(!currentPos || pending.length === 0 || geocodingAborted){
    routeOrder = PEVS.filter(p => !visited[p.id]).map(p => ({...p, distFromPrev:null, timeFromPrev:null}));
    routeUsesRealTime = false;
    return;
  }

  if(!useRealTime){
    routeOrder = [...nearestNeighborHaversine(currentPos, pending), ...noCoords];
    routeUsesRealTime = false;
    return;
  }

  const overlay = document.getElementById('route-overlay');
  overlay.classList.remove('hidden');
  document.getElementById('route-count').textContent = '0 / ' + pending.length;

  const remaining = [...pending];
  const order = [];
  let from = currentPos;
  let done = 0;
  let fallbackUsed = false;

  while(remaining.length){
    if(routeCalcAborted) break;
    let chosen, metricValue;
    try{
      const cands = remaining.map(p => getActiveCoord(p.id));
      const {durations} = await osrmRow(from, cands);
      let bestIdx = 0, bestVal = Infinity;
      for(let i=0;i<durations.length;i++){
        const v = (durations[i] === null || durations[i] === undefined) ? Infinity : durations[i];
        if(v < bestVal){ bestVal = v; bestIdx = i; }
      }
      if(bestVal === Infinity) throw new Error('no valid duration');
      chosen = remaining.splice(bestIdx,1)[0];
      metricValue = bestVal / 60;
    }catch(e){
      fallbackUsed = true;
      let bestIdx = 0, bestDist = Infinity;
      for(let i=0;i<remaining.length;i++){
        const c = getActiveCoord(remaining[i].id);
        const d = haversine(from[0], from[1], c[0], c[1]);
        if(d < bestDist){ bestDist = d; bestIdx = i; }
      }
      chosen = remaining.splice(bestIdx,1)[0];
      metricValue = bestDist / 30 * 60;
    }
    order.push({...chosen, distFromPrev:null, timeFromPrev: metricValue});
    from = getActiveCoord(chosen.id);
    done++;
    document.getElementById('route-progress').style.width = Math.round(done/pending.length*100) + '%';
    document.getElementById('route-count').textContent = done + ' / ' + pending.length;
    await new Promise(r => setTimeout(r, 40));
  }

  overlay.classList.add('hidden');
  routeOrder = [...order, ...remaining.map(p=>({...p, distFromPrev:null, timeFromPrev:null})), ...noCoords];
  routeUsesRealTime = !routeCalcAborted;
  if(fallbackUsed && !routeCalcAborted){
    showBanner('warn', 'Alguns trechos foram calculados por estimativa de distância.');
  }
}

function fmtMin(min){
  if(min === null || min === undefined) return '';
  if(min < 1) return '<1 min';
  if(min < 60) return Math.round(min) + ' min';
  const h = Math.floor(min/60), m = Math.round(min%60);
  return h + 'h' + (m>0 ? (m+'min') : '');
}

function updateStats(){
  const pendingCount = PEVS.filter(p => !visited[p.id]).length;
  const doneCount = PEVS.length - pendingCount;
  const totalMin = routeOrder.reduce((s,p) => s + (p.timeFromPrev||0), 0);
  document.getElementById('stat-pending').textContent = pendingCount;
  document.getElementById('stat-done').textContent = doneCount;
  document.getElementById('stat-time').textContent = totalMin ? Math.round(totalMin) : '0';
  document.getElementById('stat-time-label').textContent = routeUsesRealTime ? 'min de trânsito' : 'min estimados';
}

function renderList(){
  const container = document.getElementById('list-container');
  container.innerHTML = '';
  const visitedOnly = PEVS.filter(p => visited[p.id]);
  const items = [...routeOrder, ...visitedOnly];
  for(let i=0;i<items.length;i++){
    const p = items[i];
    const isDone = !!visited[p.id];
    const isManual = !!manualCoords[p.id];
    const card = document.createElement('div');
    card.className = 'card' + (isDone ? ' done' : '');
    const orderLabel = isDone ? '✓' : (routeOrder.findIndex(r=>r.id===p.id) + 1);
    
    let photoHtml = '<button class="btn small" data-photo="'+p.id+'">Tirar foto</button>';
    const ph = localStorage.getItem('photo:'+p.id);
    if(ph){ photoHtml = '<img class="thumb" src="'+ph+'" data-viewphoto="'+p.id+'"><button class="btn small" data-photo="'+p.id+'">Refazer foto</button>'; }

    card.innerHTML =
      '<div class="order-badge">'+orderLabel+'</div>'+
      '<div class="card-body">'+
        '<div class="card-top"><span class="container-id">#'+p.id+'</span>'+
        (p.timeFromPrev!==null && p.timeFromPrev!==undefined ? '<span class="dist-tag">+'+fmtMin(p.timeFromPrev)+'</span>' : '')+
        '</div>'+
        '<div class="addr">'+p.endereco+'</div>'+
        '<div class="badges">'+
          '<span class="badge">'+p.setor+'</span>'+
          '<span class="badge freq">'+p.frequencia+'</span>'+
          (isManual ? '<span class="badge manual">Ajustado</span>' : '')+
        '</div>'+
        '<div class="card-actions">'+
          '<label class="check-row"><input type="checkbox" data-visit="'+p.id+'" '+(isDone?'checked':'')+'> Visitei</label>'+
          photoHtml+
          '<button class="btn small" data-editpin="'+p.id+'">Ajustar pino</button>'+
          '<a class="nav-link gmaps" href="'+gmapsUrl(p)+'" target="_blank" rel="noopener">Maps</a>'+
          '<a class="nav-link waze" href="'+wazeUrl(p)+'" target="_blank" rel="noopener">Waze</a>'+
        '</div>'+
      '</div>';
    container.appendChild(card);
  }
  updateStats();
}

function renderMap(){
  if(geocodingAborted) return;
  if(!leafletMap){
    leafletMap = L.map('map');
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors', maxZoom: 19
    }).addTo(leafletMap);
  }
  if(mapLayer) leafletMap.removeLayer(mapLayer);
  mapLayer = L.layerGroup().addTo(leafletMap);
  const bounds = [];

  if(currentPos){
    const meIcon = L.divIcon({className:'', html:'<div class="pin me"></div>', iconSize:[22,22]});
    L.marker(currentPos, {icon: meIcon}).addTo(mapLayer).bindPopup('Você está aqui');
    bounds.push(currentPos);
  }

  PEVS.forEach(p => {
    const c = getActiveCoord(p.id);
    if(!c) return;
    const isDone = !!visited[p.id];
    const idx = routeOrder.findIndex(r=>r.id===p.id);
    const label = isDone ? '✓' : (idx>=0 ? (idx+1) : '');
    const icon = L.divIcon({className:'', html:'<div class="pin '+(isDone?'done':'pending')+'"><span>'+label+'</span></div>', iconSize:[26,26]});
    L.marker(c, {icon: icon}).addTo(mapLayer).bindPopup('#'+p.id+'<br>'+p.endereco);
    bounds.push(c);
  });

  const routeCoords = routeOrder.filter(p => getActiveCoord(p.id)).map(p => getActiveCoord(p.id));
  if(currentPos && routeCoords.length){
    L.polyline([currentPos, ...routeCoords], {color:'#2F6B4F', weight:3, opacity:.7, dashArray:'6 6'}).addTo(mapLayer);
  }

  if(bounds.length){
    leafletMap.fitBounds(bounds, {padding:[24,24]});
  }else{
    leafletMap.setView([-23.55,-46.63], 12);
  }
  setTimeout(()=>leafletMap.invalidateSize(), 100);
}

async function refreshAll(useRealTime){
  await computeRoute(!!useRealTime);
  renderList();
  if(!document.getElementById('view-map').classList.contains('hidden')) renderMap();
}

function openPinModal(id){
  const p = PEVS.find(item => item.id === id);
  if(!p) return;
  const initialCoord = getActiveCoord(id) || currentPos || [-23.55, -46.63];

  document.getElementById('modal-slot').innerHTML =
    '<div class="modal-bg" id="edit-pin-modal-bg"><div class="modal">'+
    '<h3>Ajustar local do pino</h3>'+
    '<p>#' + p.id + ' - ' + p.endereco + '</p>'+
    '<div id="edit-map-container"></div>'+
    '<div class="modal-actions">'+
      '<button class="btn primary full" id="save-pin-btn" data-id="'+id+'">Salvar posição do pino</button>'+
      '<button class="btn full" id="gps-pin-btn" data-id="'+id+'">Salvar este local pelo GPS</button>'+
      '<button class="btn full danger" id="cancel-pin-btn">Cancelar</button>'+
    '</div></div></div>';

  setTimeout(() => {
    editMap = L.map('edit-map-container').setView(initialCoord, 16);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(editMap);
    editMarker = L.marker(initialCoord, { draggable: true }).addTo(editMap);
  }, 100);
}

document.addEventListener('click', async (e) => {
  const tabBtn = e.target.closest('.tab-btn');
  if(tabBtn){
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    tabBtn.classList.add('active');
    const tab = tabBtn.dataset.tab;
    document.getElementById('view-list').classList.toggle('hidden', tab!=='list');
    document.getElementById('view-map').classList.toggle('hidden', tab!=='map');
    if(tab==='map') renderMap();
    return;
  }
  if(e.target.id === 'recalc-btn'){
    e.target.textContent = 'Buscando localização...';
    currentPos = await getPosition();
    e.target.textContent = 'Recalcular rota a partir daqui';
    if(!currentPos){ showBanner('warn', 'Permissão de GPS negada ou indisponível.'); }
    else{ document.getElementById('banner-slot').innerHTML=''; }
    await refreshAll(true);
    return;
  }
  if(e.target.id === 'skip-route'){
    routeCalcAborted = true;
    document.getElementById('route-overlay').classList.add('hidden');
    return;
  }
  const photoBtn = e.target.closest('[data-photo]');
  if(photoBtn){
    activePhotoId = photoBtn.dataset.photo;
    document.getElementById('photo-input').click();
    return;
  }
  const editPinBtn = e.target.closest('[data-editpin]');
  if(editPinBtn){
    openPinModal(editPinBtn.dataset.editpin);
    return;
  }
  if(e.target.id === 'save-pin-btn'){
    const id = e.target.dataset.id;
    if(editMarker){
      const pos = editMarker.getLatLng();
      manualCoords[id] = [pos.lat, pos.lng];
      saveManualCoords();
      document.getElementById('modal-slot').innerHTML = '';
      await refreshAll();
    }
    return;
  }
  if(e.target.id === 'gps-pin-btn'){
    const id = e.target.dataset.id;
    const pos = await getPosition();
    if(pos){
      manualCoords[id] = pos;
      saveManualCoords();
      document.getElementById('modal-slot').innerHTML = '';
      await refreshAll();
    }else{
      alert('Não foi possível obter a localização atual via GPS.');
    }
    return;
  }
  if(e.target.id === 'cancel-pin-btn'){
    document.getElementById('modal-slot').innerHTML = '';
    return;
  }
  const viewPhoto = e.target.closest('[data-viewphoto]');
  if(viewPhoto){
    const id = viewPhoto.dataset.viewphoto;
    const photoData = localStorage.getItem('photo:'+id);
    document.getElementById('modal-slot').innerHTML =
      '<div class="modal-bg" id="photo-modal-bg"><div class="modal"><img src="'+photoData+'">'+
      '<div class="modal-actions"><button class="btn full" id="close-photo-modal">Fechar</button></div></div></div>';
    return;
  }
  if(e.target.id === 'close-photo-modal' || e.target.id === 'photo-modal-bg'){
    document.getElementById('modal-slot').innerHTML = '';
    return;
  }
  if(e.target.id === 'skip-geocode'){
    geocodingAborted = true;
    document.getElementById('geocode-overlay').classList.add('hidden');
    return;
  }
  if(e.target.id === 'reset-btn'){
    document.getElementById('modal-slot').innerHTML =
      '<div class="modal-bg" id="reset-modal-bg"><div class="modal"><h3>Reiniciar mês</h3>'+
      '<p>Isso vai desmarcar os pontos visitados e apagar as fotos. As posições ajustadas manualmente dos pinos serão mantidas.</p>'+
      '<div class="modal-actions"><button class="btn full" id="cancel-reset">Cancelar</button><button class="btn full danger" id="confirm-reset">Reiniciar</button></div></div></div>';
    return;
  }
  if(e.target.id === 'cancel-reset' || e.target.id === 'reset-modal-bg'){
    document.getElementById('modal-slot').innerHTML = '';
    return;
  }
  if(e.target.id === 'confirm-reset'){
    for(const p of PEVS){
      localStorage.removeItem('photo:'+p.id);
    }
    visited = {};
    saveVisited();
    document.getElementById('modal-slot').innerHTML = '';
    await refreshAll();
    return;
  }
  if(e.target.id === 'export-xlsx-btn'){
    const rows = PEVS.map(p => ({
      'N Container': p.id,
      'Endereco': p.endereco,
      'Setor': p.setor,
      'Frequencia vidro': p.frequencia,
      'Visitado': visited[p.id] ? 'Sim' : 'Nao',
      'Data exportacao': new Date().toLocaleDateString('pt-BR')
    }));
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Rota PEV');
    XLSX.writeFile(wb, 'rota_pev_' + new Date().toISOString().slice(0,10) + '.xlsx');
    return;
  }
  if(e.target.id === 'export-photos-btn'){
    const btn = e.target;
    btn.textContent = 'Preparando...';
    const zip = new JSZip();
    let count = 0;
    for(const p of PEVS){
      const ph = localStorage.getItem('photo:'+p.id);
      if(ph){
        const base64 = ph.split(',')[1];
        zip.file(p.id + '.jpg', base64, {base64:true});
        count++;
      }
    }
    btn.textContent = 'Baixar fotos';
    if(count === 0){ showBanner('warn', 'Nenhuma foto salva para exportar.'); return; }
    const blob = await zip.generateAsync({type:'blob'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'fotos_pev_' + new Date().toISOString().slice(0,10) + '.zip';
    a.click();
    URL.revokeObjectURL(url);
    return;
  }
  if(e.target.id === 'export-backup-btn'){
    const backupData = {
      visited,
      geocodeCache,
      manualCoords,
      photos: {}
    };
    for(const p of PEVS){
      const ph = localStorage.getItem('photo:'+p.id);
      if(ph) backupData.photos[p.id] = ph;
    }
    const blob = new Blob([JSON.stringify(backupData)], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'backup_rota_pev_' + new Date().toISOString().slice(0,10) + '.json';
    a.click();
    URL.revokeObjectURL(url);
    return;
  }
  if(e.target.id === 'import-backup-btn'){
    document.getElementById('backup-input').click();
    return;
  }
});

document.addEventListener('change', async (e) => {
  if(e.target.matches('[data-visit]')){
    const id = e.target.dataset.visit;
    visited[id] = e.target.checked;
    saveVisited();
    await refreshAll();
    return;
  }
  if(e.target.id === 'backup-input' && e.target.files[0]){
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = async (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if(data.visited) { visited = data.visited; saveVisited(); }
        if(data.geocodeCache) { geocodeCache = data.geocodeCache; saveGeocodeCache(); }
        if(data.manualCoords) { manualCoords = data.manualCoords; saveManualCoords(); }
        if(data.photos) {
          Object.keys(data.photos).forEach(k => localStorage.setItem('photo:'+k, data.photos[k]));
        }
        alert('Backup restaurado com sucesso!');
        await refreshAll();
      } catch(err) {
        alert('Erro ao carregar arquivo de backup.');
      }
    };
    reader.readAsText(file);
  }
  if(e.target.id === 'photo-input' && e.target.files[0] && activePhotoId){
    const file = e.target.files[0];
    const img = new Image();
    const reader = new FileReader();
    reader.onload = (ev) => {
      img.onload = async () => {
        const maxW = 1280;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.65);
        try{ localStorage.setItem('photo:'+activePhotoId, dataUrl); }catch(err){}
        e.target.value = '';
        await refreshAll();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }
});

async function init(){
  document.getElementById('month-label').textContent = new Date().toLocaleDateString('pt-BR', {month:'long', year:'numeric'});
  loadVisited();
  loadGeocodeCache();
  loadManualCoords();
  await runGeocoding();
  currentPos = await getPosition();
  if(!currentPos && !geocodingAborted){
    showBanner('warn', 'Não foi possível obter a localização inicial via GPS. Toque em "Recalcular rota".');
  }
  await refreshAll();
}

window.onload = init;
</script>
